[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binner-mcp"
version = "0.1.0"
description = "MCP server and Python API client for local Binner inventory management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anastasios Symeonidis" },
]
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "binner",
    "inventory",
    "electronics",
    "parts",
    "bom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/asymeon/binner-mcp"
Documentation = "https://binner-mcp.readthedocs.io/"
Repository = "https://github.com/asymeon/binner-mcp"
Issues = "https://github.com/asymeon/binner-mcp/issues"

[project.scripts]
binner-mcp = "binner_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
